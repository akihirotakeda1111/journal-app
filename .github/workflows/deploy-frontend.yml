name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN || secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
      REACT_S3_BUCKET: ${{ vars.REACT_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Validate required configuration
        run: |
          missing=0
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "::error::AWS_FRONTEND_DEPLOY_ROLE_ARN is not set (Repository Variables or Secrets)"
            missing=1
          elif [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "::error::AWS_FRONTEND_DEPLOY_ROLE_ARN must be a full IAM role ARN"
            missing=1
          fi
          if [ -z "${REACT_S3_BUCKET}" ]; then
            echo "::error::REACT_S3_BUCKET is not set (Repository Variables)"
            missing=1
          fi
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::CLOUDFRONT_DISTRIBUTION_ID is not set (Repository Variables)"
            missing=1
          fi
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::error::VITE_API_BASE_URL is not set (Repository Variables)"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: github-actions-frontend-${{ github.run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${REACT_S3_BUCKET}/" \
            --delete \
            --region "${AWS_REGION}"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
