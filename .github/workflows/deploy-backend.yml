name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.dev.yml"
      - "nginx/**"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN || secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate required configuration
        run: |
          missing=0
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "::error::AWS_BACKEND_DEPLOY_ROLE_ARN is not set (Repository Variables or Secrets)"
            missing=1
          elif [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]+:role/ ]]; then
            echo "::error::AWS_BACKEND_DEPLOY_ROLE_ARN must be a full IAM role ARN"
            missing=1
          fi
          if [ -z "${EC2_INSTANCE_ID}" ]; then
            echo "::error::EC2_INSTANCE_ID is not set (Repository Variables)"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: github-actions-backend-${{ github.run_id }}

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions backend deploy ${GITHUB_SHA}" \
            --parameters 'commands=["sudo -u ec2-user bash -c \"cd /home/ec2-user/journal-app && git fetch origin main && git reset --hard origin/main && bash scripts/deploy-backend.sh\""]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt ${i}: ${STATUS}"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "[StandardOutputContent, StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "SSM command timed out waiting for completion"
          exit 1
